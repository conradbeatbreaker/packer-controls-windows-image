name: Build image

on:
  pull_request:
    paths:
      - '**.pkr.hcl'
      - '!versions.pkr.hcl'
      - 'ansible/**'
      - 'data_vsphere/**'
      - 'guest-scripts/**'
  push:
    branches: [main]
    paths:
      - '**.pkr.hcl'
      - '!versions.pkr.hcl'
      - 'ansible/**'
      - 'data_vsphere/**'
      - 'guest-scripts/**'
  workflow_dispatch:
    inputs:
      os_selection:
        description: "OS to build"
        type: choice
        options: ["Windows Server 2019", "Windows Server 2022", "Windows Server 2025"]
        default: "Windows Server 2025"
      iso_item_name:
        description: "OS ISO content-library item name"
        required: true
      tools_item_name:
        description: "VMware Tools ISO content-library item name"
        required: true

# A toolchain bump only changes versions.pkr.hcl, so it never triggers a
# build: validate.yml covers it. The negation must come after '**.pkr.hcl'
# (last match wins).

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, packer]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain commit
        id: pin
        run: |
          sha="$(tr -d '[:space:]' < .toolchain-sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.toolchain-sha is not a full commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out packer-toolchain at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: conradbeatbreaker/packer-toolchain
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.TOOLCHAIN_READ_TOKEN }}
          path: .toolchain
          persist-credentials: false
        # One commit governs the versions, the pinned keys and the
        # verification code. A composite action pinned separately in this
        # file could drift from .toolchain-sha.

      - name: Bootstrap Packer and plugins from Nexus
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_CI_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_CI_PASS }}
        run: .toolchain/scripts/bootstrap.sh
        # Pulls the pinned versions from packer-hosted, verifies the
        # SHA256SUMS signature against the pinned key and the zip against
        # the sums, installs via `packer plugins install --path`. Fails the
        # job on any mismatch.

      - name: Build
        if: github.event_name != 'pull_request'
        run: packer build .
        env:
          # Push builds have no inputs; they fall back to repository variables.
          PKR_VAR_os_selection: ${{ inputs.os_selection || vars.OS_SELECTION }}
          PKR_VAR_iso_item_name: ${{ inputs.iso_item_name || vars.ISO_ITEM_NAME }}
          PKR_VAR_tools_item_name: ${{ inputs.tools_item_name || vars.TOOLS_ITEM_NAME }}
          PKR_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
          PKR_VAR_winrm_password: ${{ secrets.WINRM_PASSWORD }}
