name: Bump toolchain

# Triggered by the toolchain repo's promote job. Pulls the approved
# versions.yaml at a specific commit, regenerates versions.pkr.hcl,
# and opens a PR here. This repo approves its own bump.

on:
  workflow_dispatch:
    inputs:
      toolchain_sha:
        description: "Commit SHA in packer-toolchain to pin to"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: [self-hosted, linux, packer]
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate versions.pkr.hcl from approved versions.yaml
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sha="${{ inputs.toolchain_sha }}"
          sha="$(echo "$sha" | tr -d '[:space:]')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA: $sha"; exit 1; }
          gh api \
            "repos/conradbeatbreaker/packer-toolchain/contents/versions.yaml?ref=$sha" \
            --jq '.content' | base64 -d > "$tmp"
          ./scripts/generate-required-plugins.sh "$tmp"
          echo "$sha" > .toolchain-sha

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump/toolchain
          delete-branch: true
          title: "Bump Packer toolchain to ${{ inputs.toolchain_sha }}"
          body: |
            Toolchain bump promoted upstream and approved there.
            This PR pins this image repo to that approved state.

            Toolchain commit: conradbeatbreaker/packer-toolchain@${{ inputs.toolchain_sha }}

            CI will verify versions.pkr.hcl matches versions.yaml and
            that a build succeeds before this is mergeable.
          labels: toolchain-bump
